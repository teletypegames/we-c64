# The host tests (scripts/ci-test.sh: the portable layers against a small HTTP
# server and a folder for a disk); passed through next to the generated c64 pipeline.
when:
  - event: [push, manual]
    branch: master
  - event: pull_request
  - event: tag

steps:
  - name: test
    image: debian:bookworm-slim
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev make python3 cc65 >/dev/null
      - sh scripts/ci-test.sh
